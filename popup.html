<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quanto Gastei?</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="brand-icon">Q</span><span>QUANTO GASTEI?</span></div>
      <p class="eyebrow">SEUS PEDIDOS NA SHOPEE</p>
      <h1 id="total">R$ 0,00</h1>
      <p id="summary" class="summary">Abra a área de pedidos da Shopee para começar.</p>
      <button id="scan" type="button">Somar pedidos desta página</button>
      <p class="hint">Role a lista para carregar mais pedidos e clique novamente. A extensão só lê a página aberta; seus dados ficam no navegador.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
